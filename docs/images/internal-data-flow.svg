<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" role="img" aria-labelledby="title desc"><title id="title">내부 동작 · 정본과 쓰기·조회 경로</title><desc id="desc">worker와 메인 세션은 Task Markdown에 항목을 기록하고 harness work_sessions에 bind하며 scheduler ref CLI를 호출한다. ref CLI는 Task 항목 hash를 계산·재검증하고 원장 SQLite(attempts, messages, ref_events, message_audit)에 envelope·상태·감사를 쓰며 Orca에 wake를 보낸다. scheduler run·tick은 Task를 읽어 배정하고 영수증을 원장에 수집하며 Orca로 worker를 launch하고, Orca 실행은 attempts/UUID 영수증을 남긴다. watch는 Task, harness, 원장, 영수증, Orca를 읽기만 한다.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#78979e" stroke-width="1.5"/></marker></defs><style>text{font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#23434d}.title{font-size:32px;font-weight:700}.head{font-size:24px;font-weight:700}.body{font-size:20px;fill:#58747d}.small{font-size:18px;fill:#58747d}</style><rect width="1440" height="880" fill="white"/>
<text x="48" y="53" class="title" text-anchor="start">정본은 셋으로 나누고, watch는 읽기만 한다</text>
<text x="48" y="87" class="body" text-anchor="start">업무 상태는 Task · 실행·전달은 원장 · 세션 연결은 harness · 실선은 쓰기·실행, 점선은 조회</text>
<rect x="48" y="120" width="352" height="130" rx="14" fill="white" stroke="#bdd1d8" stroke-width="1.7"/>
